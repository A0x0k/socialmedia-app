{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="auth-card">
                <h2 class="mb-4">{% translate "تعديل الملف الشخصي" %}</h2>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="bio" class="form-label">{% translate "نبذة عنك" %}</label>
                        <textarea class="form-control" id="bio" name="bio" rows="3">{{ profile.bio }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="location" class="form-label">{% translate "الموقع" %}</label>
                        <input type="text" class="form-control" id="location" name="location" value="{{ profile.location }}">
                    </div>
                    <div class="mb-3">
                        <label for="profile_picture" class="form-label">{% translate "الصورة الشخصية" %}</label>
                        <input type="file" class="form-control" id="profile_picture" name="profile_picture">
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary py-2">{% translate "حفظ التغييرات" %}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
