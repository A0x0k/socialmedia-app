{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load i18n %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="auth-card">
                <h2 class="text-center">{% translate "تسجيل حساب جديد" %}</h2>
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button class="btn btn-primary py-2" type="submit">{% translate "تسجيل" %}</button>
                    </div>
                </form>
                <div class="text-center mt-4">
                    <p class="text-secondary">{% translate "هل لديك حساب بالفعل؟" %} <a href="{% url 'users:login' %}">{% translate "تسجيل الدخول" %}</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
