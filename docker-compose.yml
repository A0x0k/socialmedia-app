version: "3.9"

x-app-defaults: &app-defaults
  build: .
  env_file:
    - .env
  environment:
    - DEBUG=False
    - REDIS_URL=redis://redis:6379/1
    - SECRET_KEY=${SECRET_KEY}
  depends_on:
    redis:
      condition: service_healthy

services:
  web:
    <<: *app-defaults
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles_build
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--deploy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  media_data:
  static_data:
  redis_data:
